name: MeetingTranscriber
options:
  bundleIdPrefix: com.shimonshaked
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  MTCore:
    path: Packages/MTCore
targets:
  MeetingTranscriber:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
    dependencies:
      - package: MTCore
    settings:
      base:
        PRODUCT_NAME: MeetingTranscriber
        PRODUCT_BUNDLE_IDENTIFIER: com.shimonshaked.MeetingTranscriber
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Transcriber
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used to record your meetings. Audio stays on this device unless you choose a cloud transcription service."
        "INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=iphone*]": NO
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/MeetingTranscriber-macOS.entitlements
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MeetingTranscriberTests
  MeetingTranscriberTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - AppTests
    dependencies:
      - target: MeetingTranscriber
      - package: MTCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shimonshaked.MeetingTranscriberTests
        # Multi-destination target: the host binary lives at a different path inside a Mac .app.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/MeetingTranscriber.app/Contents/MacOS/MeetingTranscriber"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/MeetingTranscriber.app/MeetingTranscriber"
        BUNDLE_LOADER: "$(TEST_HOST)"
