name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job on one macOS runner (macOS runners are scarce; a matrix needs several at once).
jobs:
  test:
    name: Build & test (MTCore, macOS, iPhone, iPad)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version

      - name: MTCore package tests
        run: swift test --package-path Packages/MTCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App tests on macOS, iPhone and iPad simulators
        run: scripts/ci-test.sh

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results/
