name: CI

# Manual only, to stay within the free macOS minutes (macOS minutes count 10x).
# Start from the Actions tab or: gh workflow run ci.yml
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (macos-15-intel, macos-15, macos-26)"
        default: macos-15-intel
      platforms:
        description: "Platforms to test (space-separated: macOS iPhone iPad)"
        default: "macOS iPhone iPad"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job on one macOS runner (macOS runners are scarce; a matrix needs several at once).
jobs:
  test:
    name: Build & test (MTCore, macOS, iPhone, iPad)
    # Apple-silicon runners were repeatedly unavailable (capacity); Intel images also ship Xcode 26.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XC" || { echo "::error::No Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: MTCore package tests
        run: swift test --package-path Packages/MTCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App tests on macOS, iPhone and iPad simulators
        run: scripts/ci-test.sh
        env:
          PLATFORMS: ${{ inputs.platforms || 'macOS iPhone iPad' }}

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results/
